name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main, Hoang]
  # Cho phép bấm chạy tay từ tab Actions, tiện khi muốn deploy lại mà không cần commit mới.
  workflow_dispatch:

# Hai lần push sát nhau: bỏ bản build cũ, chỉ deploy commit mới nhất.
concurrency:
  group: deploy-swa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Deploy token là thứ duy nhất workflow này cần. Thiếu nó thì action bên dưới đổ một
      # lỗi khó đọc về "deployment_token was not provided"; nói thẳng ra ở đây thay vì để
      # người đọc log tự đoán.
      - name: Check the repository secret is set
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Missing repository secret AZURE_STATIC_WEB_APPS_API_TOKEN."
            echo "Lấy giá trị bằng:"
            echo "  az staticwebapp secrets list --name swa-qlpk-hoangqlpk97 \\"
            echo "    --resource-group rg-qlpk --query properties.apiKey -o tsv"
            echo "rồi thêm ở Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Deploy token đã có."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` chứ không phải `npm install`: cài đúng theo package-lock.json, nên bản
      # deploy dùng đúng bộ thư viện đã test ở máy.
      - run: npm ci

      # Dừng deploy khi có thư viện dính lỗ hổng mức high trở lên đã công bố.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Chạy trước khi deploy, để một lỗi TypeScript không lên tới production.
      # tsconfig.app.json bật noUnusedLocals nên một import thừa cũng làm bước này đỏ.
      - name: Build
        run: npm run build

      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # `dist` đã build sẵn ở bước trên nên bỏ qua bước build của Oryx. Khi
          # skip_app_build bật, action BỎ QUA output_location và upload nguyên app_location —
          # vì thế app_location phải là chính thư mục đã build. Để "/" thì nó đẩy mã nguồn
          # thô lên, index.html trỏ vào /src/main.tsx và trang trắng.
          app_location: "dist"
          skip_app_build: true
          skip_api_build: true

      # Chỉ kiểm tra HTTP 200 là chưa đủ: bản mã nguồn thô cũng trả 200. Phải chắc trang
      # phục vụ đúng bản đã build (có /assets/index-*.js), và đường dẫn con vẫn rơi về
      # index.html nhờ staticwebapp.config.json (Vite copy nó từ public/ vào dist/).
      - name: Check the site answers
        run: |
          site="https://wonderful-plant-05c95c300.6.azurestaticapps.net"
          sleep 20
          for path in / /dang-ky; do
            html=$(curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 10 --retry-all-errors "$site$path")
            if ! printf '%s' "$html" | grep -q '/assets/index-'; then
              echo "::error::$site$path không trả về bản đã build (thiếu /assets/index-*.js)."
              exit 1
            fi
            echo "OK $path"
          done
          echo "Deployed ${{ github.sha }}"
