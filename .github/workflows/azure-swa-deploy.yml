name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main, Hoang]
  # Cho phép bấm chạy tay từ tab Actions, tiện khi muốn deploy lại mà không cần commit mới.
  workflow_dispatch:

# Hai lần push sát nhau: bỏ bản build cũ, chỉ deploy commit mới nhất.
concurrency:
  group: deploy-swa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Deploy token là thứ duy nhất workflow này cần. Thiếu nó thì action bên dưới đổ một
      # lỗi khó đọc về "deployment_token was not provided"; nói thẳng ra ở đây thay vì để
      # người đọc log tự đoán.
      - name: Check the repository secret is set
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Missing repository secret AZURE_STATIC_WEB_APPS_API_TOKEN."
            echo "Lấy giá trị bằng:"
            echo "  az staticwebapp secrets list --name swa-qlpk-hoangqlpk97 \\"
            echo "    --resource-group rg-qlpk --query properties.apiKey -o tsv"
            echo "rồi thêm ở Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Deploy token đã có."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` chứ không phải `npm install`: cài đúng theo package-lock.json, nên bản
      # deploy dùng đúng bộ thư viện đã test ở máy.
      - run: npm ci

      # Chạy trước khi deploy, để một lỗi TypeScript không lên tới production.
      # tsconfig.app.json bật noUnusedLocals nên một import thừa cũng làm bước này đỏ.
      - name: Build
        run: npm run build

      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # `dist` đã build sẵn ở bước trên, nên Oryx không cần build lại trên runner.
          app_location: "/"
          output_location: "dist"
          skip_app_build: true
          skip_api_build: true

      # Không có bước này thì workflow vẫn xanh kể cả khi site không phục vụ được gì.
      - name: Check the site answers
        run: |
          sleep 20
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            "https://wonderful-plant-05c95c300.6.azurestaticapps.net/" > /dev/null
          echo "Deployed ${{ github.sha }}"
